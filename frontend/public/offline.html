<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bashiri — Hakuna Mtandao</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #0A0A0A;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    .wrap {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      padding-top: env(safe-area-inset-top, 24px);
      padding-bottom: env(safe-area-inset-bottom, 24px);
      background: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.08) 0%, transparent 50%);
    }
    .glass-card {
      background: rgba(17, 18, 24, 0.7);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 40px 32px;
      max-width: 340px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .logo {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      margin-bottom: 24px;
      object-fit: contain;
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
    }
    h1 {
      color: #FFFFFF;
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    .message-card {
      background: rgba(212, 175, 55, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 28px;
    }
    .message-card p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 15px;
      line-height: 1.6;
      font-weight: 500;
    }
    button {
      background: linear-gradient(135deg, #D4AF37 0%, #CFAF7B 100%);
      color: #051006;
      border: none;
      border-radius: 16px;
      padding: 16px 40px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
      transition: all 0.2s ease;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(212, 175, 55, 0.5);
    }
    button:active {
      transform: translateY(0);
      opacity: 0.9;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #EF4444;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
    }
    .status-text {
      color: rgba(255, 255, 255, 0.4);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="glass-card">
      <img src="/icon-192.png" alt="Bashiri" class="logo" />
      <h1>Hakuna Mtandao</h1>
      <div class="status-indicator">
        <div class="status-dot"></div>
        <span class="status-text">Offline</span>
      </div>
      <div class="message-card">
        <p>Bashiri inahitaji internet kupata AI Predictions na Live Scores mpya. Angalia mtandao wako kisha jaribu tena.</p>
      </div>
      <button onclick="window.location.reload()">Jaribu Tena</button>
    </div>
  </div>
</body>
</html>
