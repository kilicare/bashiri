<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bashiri — Hakuna Mtandao</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #0A0A0A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .wrap {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      padding-top: env(safe-area-inset-top, 24px);
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      margin-bottom: 20px;
      object-fit: contain;
    }
    h1 {
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 8px;
    }
    p {
      color: rgba(255,255,255,0.55);
      font-size: 14px;
      max-width: 280px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    button {
      background: #D4AF37;
      color: #051006;
      border: none;
      border-radius: 16px;
      padding: 14px 28px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="/icon-192.png" alt="Bashiri" class="logo" />
    <h1>Hakuna Mtandao</h1>
    <p>Bashiri inahitaji internet kupata AI Predictions na Live Scores mpya. Angalia mtandao wako kisha jaribu tena.</p>
    <button onclick="window.location.reload()">Jaribu Tena</button>
  </div>
</body>
</html>
