<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bashiri - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09090B;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #F8FAFC;
    }
    .container {
      max-width: 400px;
      width: 90%;
      text-align: center;
      padding: 2rem;
    }
    .card {
      background: rgba(17, 18, 24, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 1.5rem;
      padding: 2rem;
    }
    .logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      object-fit: contain;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
      50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(212, 175, 55, 0.6); }
    }
    h2 {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      color: #F8FAFC;
    }
    p {
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 1rem;
    }
    .divider {
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 1.5rem 0;
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #EF4444;
      animation: blink 1s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .status-text {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.4);
    }
    button {
      width: 100%;
      padding: 0.875rem;
      background: #D4AF37;
      color: #09090B;
      border: none;
      border-radius: 0.75rem;
      font-weight: bold;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
    }
    button:hover {
      transform: scale(1.02);
    }
    button:active {
      transform: scale(0.98);
    }
    .quote {
      font-size: 0.75rem;
      font-style: italic;
      color: rgba(255, 255, 255, 0.25);
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <img src="/icon.png" alt="Bashiri AI" class="logo">
      <h2>AI Offline</h2>
      <p>Waiting for live match data...</p>
      
      <div class="divider"></div>
      
      <p>Bashiri cannot retrieve match data right now. We'll reconnect automatically.</p>
      
      <div class="status">
        <div class="status-dot"></div>
        <span class="status-text">Offline</span>
      </div>
      
      <button onclick="window.location.reload()">↻ Retry Connection</button>
      
      <p class="quote">"Great predictions begin with great data."</p>
    </div>
  </div>
  
  <script>
    // Auto-retry every 3 seconds
    let retryCount = 0;
    const maxRetries = 10;
    
    function checkConnection() {
      if (retryCount >= maxRetries) return;
      
      fetch('/manifest.json', { method: 'GET', cache: 'no-store' })
        .then(response => {
          if (response.ok) {
            // Redirect to where user was before going offline
            const lastUrl = localStorage.getItem('lastUrl') || '/home';
            window.location.href = lastUrl;
          }
        })
        .catch(() => {
          retryCount++;
          setTimeout(checkConnection, 3000);
        });
    }
    
    setTimeout(checkConnection, 3000);
  </script>
</body>
</html>
